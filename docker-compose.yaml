services:
  joppekoers.nl:
    container_name: joppekoers.nl
    image: ghcr.io/joppekoers/joppekoers.nl/frontend
    restart: unless-stopped
    environment:
      - PORT=8080

  cms:
    container_name: cms
    image: ghcr.io/joppekoers/joppekoers.nl/cms
    restart: unless-stopped
    volumes:
      - ./runtimeGenerated/cms/projects:/app/projects
      - ./runtimeGenerated/cms/media:/app/media
    environment:
      - PORT=1337
    ports:
      - 1337:1337

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_ROLLING_RESTART=true
    command: joppekoers.nl pixels cms github-runner-celebratix-1 github-runner-celebratix-2

  # https://jellyfin.org/docs/general/installation/container
  jellyfin:
    container_name: jellyfin
    restart: unless-stopped
    image: jellyfin/jellyfin
    ports:
      - 8096:8096
    # user: uid:gid
    volumes:
      - ./runtimeGenerated/jellyfin/config:/config
      - ./runtimeGenerated/jellyfin/cache:/cache
      - ${HOME}/files/films:/files/films:ro
      - ${HOME}/files/series:/files/series:ro
      - ${HOME}/files/torrents/downloaded:/files/torrents:ro
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.joppekoers.nl
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - host.docker.internal:host-gateway

  qbittorrent:
    container_name: qbittorrent
    restart: unless-stopped
    image: ghcr.io/linuxserver/qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - WEBUI_PORT=8081
    volumes:
      - ./runtimeGenerated/qbittorrent/config:/config
      - ${HOME}/files/torrents/:/mnt/files

  filerun:
    container_name: filerun
    image: filerun/filerun
    user: "1000:1000"
    environment:
      FR_DB_HOST: filerun-db
      FR_DB_PORT: 3306
      FR_DB_NAME: filerun
      FR_DB_USER: filerun
      FR_DB_PASS: filerun
    depends_on:
      - filerun-db
    links:
      - filerun-db:filerun-db
    volumes:
      - /home/joppe:/user-files
      - ./runtimeGenerated/filerun/html:/var/www/html
    ports:
      - "1111:80"
  filerun-db:
    image: mariadb:12.2
    environment:
      MARIADB_ROOT_PASSWORD: filerun
      MYSQL_DATABASE: filerun
      MYSQL_USER: filerun
      MYSQL_PASSWORD: filerun
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - ./runtimeGenerated/filerun-db:/var/lib/mysql

  pixels:
    container_name: pixels
    image: ghcr.io/pixelcorp-nl/canvas.edu/canvas.edu
    restart: unless-stopped
    env_file:
      - ./pixels/.env
    depends_on:
      - redis
      - postgres
    ports:
      - 5173:5173

  redis:
    container_name: redis
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - ./runtimeGenerated/pixels/redis-db:/data

  postgres:
    container_name: postgres
    restart: unless-stopped
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./runtimeGenerated/pixels/postgres-db:/var/lib/postgresql/data

  github-runner-celebratix-1:
    container_name: github-runner-celebratix-1
    image: ghcr.io/celebratix/docker-github-actions-runner:ubuntu-latest
    restart: unless-stopped
    # https://github.com/organizations/Celebratix/settings/actions/runners/new
    command: https://github.com/Celebratix AHTP3JEOUNIYWEYKNJNZ253JTWHLU server1-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtimeGenerated/github-runner-celebratix-1/root:/root

  github-runner-celebratix-2:
    container_name: github-runner-celebratix-2
    image: ghcr.io/celebratix/docker-github-actions-runner:ubuntu-latest
    restart: unless-stopped
    # https://github.com/organizations/Celebratix/settings/actions/runners/new
    command: https://github.com/Celebratix AHTP3JA4S4BHESYQG5UPB3LJEJPZM server1-2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtimeGenerated/github-runner-celebratix-2/root:/root

  tunnel:
    container_name: tunnel
    depends_on:
      - nginx
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel run
    env_file:
      - ./tunnel/.env

  nginx:
    container_name: nginx
    restart: unless-stopped
    image: nginx:alpine
    environment:
      - CERTBOT_EMAIL=joppe.koers@gmail.com
      # - STAGING=1
      # - USE_ECDSA=1 # maybe in the future
      - DHPARAM_SIZE=2048
      - RSA_KEY_SIZE=4096
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./host:/host:ro
    depends_on:
      joppekoers.nl:
        condition: service_started
      cms:
        condition: service_started
      qbittorrent:
        condition: service_started
      filerun:
        condition: service_started
      jellyfin:
        condition: service_started
