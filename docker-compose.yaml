services:
  joppekoers.nl:
    container_name: joppekoers.nl
    image: ghcr.io/joppekoers/joppekoers.nl/app:latest
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    volumes:
      - ./runtimeGenerated/joppekoers.nl/cdn:/app/cdn
      - ./runtimeGenerated/joppekoers.nl/cache:/app/cache
      - ./runtimeGenerated/joppekoers.nl/media:/app/backend/media
      - ./runtimeGenerated/joppekoers.nl/uploads:/app/backend/uploads
    environment:
      - PROJECTS_DIR=/app/cdn/projectImg
      - CACHE_DIR=/app/cache
      - CDN_REPO_DIR=/app/cdn
      - SYNC_TOKEN=${SYNC_TOKEN:?SYNC_TOKEN must be set}

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_ROLLING_RESTART=true
      - DOCKER_API_VERSION=1.44
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=${WATCHTOWER_HTTP_API_TOKEN:?WATCHTOWER_HTTP_API_TOKEN must be set}

  # https://jellyfin.org/docs/general/installation/container
  jellyfin:
    container_name: jellyfin
    restart: unless-stopped
    image: jellyfin/jellyfin
    ports:
      - 8096:8096
    # user: uid:gid
    volumes:
      - ./runtimeGenerated/jellyfin/config:/config
      - ./runtimeGenerated/jellyfin/cache:/cache
      - ${HOME}/files/films:/files/films:ro
      - ${HOME}/files/series:/files/series:ro
      - ${HOME}/files/torrents/downloaded:/files/torrents:ro
    environment:
      - JELLYFIN_PublishedServerUrl=https://jellyfin.joppekoers.nl
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - host.docker.internal:host-gateway

  qbittorrent:
    container_name: qbittorrent
    restart: unless-stopped
    image: ghcr.io/linuxserver/qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - WEBUI_PORT=8081
    volumes:
      - ./runtimeGenerated/qbittorrent/config:/config
      - ${HOME}/files/torrents/:/mnt/files

  filerun:
    container_name: filerun
    image: filerun/filerun
    user: "1000:1000"
    environment:
      FR_DB_HOST: filerun-db
      FR_DB_PORT: 3306
      FR_DB_NAME: filerun
      FR_DB_USER: filerun
      FR_DB_PASS: filerun
      FR_DB_ROOT_PASS: filerun
    depends_on:
      - filerun-db
    links:
      - filerun-db:filerun-db
    volumes:
      - /home/joppe:/user-files
      - ./runtimeGenerated/filerun/html:/var/www/html
    ports:
      - "1111:80"
  filerun-db:
    image: mariadb:12.2
    command: --old-mode=NO_PROGRESS_INFO
    environment:
      MARIADB_ROOT_PASSWORD: filerun
      MYSQL_DATABASE: filerun
      MYSQL_USER: filerun
      MYSQL_PASSWORD: filerun
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - ./runtimeGenerated/filerun-db:/var/lib/mysql

  pixels:
    container_name: pixels
    image: ghcr.io/pixelcorp-nl/canvas.edu/canvas.edu
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true
    env_file:
      - ./pixels/.env
    depends_on:
      - redis
      - postgres
    ports:
      - 5173:5173

  redis:
    container_name: redis
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - ./runtimeGenerated/pixels/redis-db:/data

  postgres:
    container_name: postgres
    restart: unless-stopped
    image: postgres:alpine
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./runtimeGenerated/pixels/postgres-db:/var/lib/postgresql/data

  tunnel:
    container_name: tunnel
    depends_on:
      - nginx
    image: cloudflare/cloudflared
    restart: unless-stopped
    command: tunnel run
    env_file:
      - ./tunnel/.env

  nginx:
    container_name: nginx
    restart: unless-stopped
    image: nginx:alpine
    environment:
      - CERTBOT_EMAIL=joppe.koers@gmail.com
      # - STAGING=1
      # - USE_ECDSA=1 # maybe in the future
      - DHPARAM_SIZE=2048
      - RSA_KEY_SIZE=4096
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./host:/host:ro
    depends_on:
      joppekoers.nl:
        condition: service_started
      qbittorrent:
        condition: service_started
      filerun:
        condition: service_started
      jellyfin:
        condition: service_started

  movie-sync:
    container_name: movie-sync
    build: ./movie-sync
    restart: unless-stopped
    user: "1000:1000"
    profiles: ["donotstart"]
    volumes:
      - ${HOME}/files/torrents/downloaded:/input:ro
      - ${HOME}/files/movies-web:/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
